[project]
name = "cofrial-iot-simulator"
version = "1.0.0"
description = "Simulador de telemetría IoT de la flota frigorífica de Cofrial (T-019)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
