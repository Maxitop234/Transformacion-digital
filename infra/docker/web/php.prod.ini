; Ajustes adicionales de producción (T-024): el código no cambia dentro de la
; imagen, así que OPcache no necesita revisar los archivos en cada petición.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
display_errors = Off
log_errors = On
