# Nginx de desarrollo: publica Laravel y deriva /bi a Grafana (ADR-0010).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;
    # Redirecciones relativas: conservan el puerto publicado (8080).
    absolute_redirect off;

    # DNS interno de Docker: resuelve `web` y `grafana` en cada petición, así un
    # contenedor recreado (IP nueva) no deja a Nginx respondiendo 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_php web:9000;
    set $upstream_grafana http://grafana:3000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Grafana se sirve desde el subpath /bi (GF_SERVER_SERVE_FROM_SUB_PATH=true).
    location = /bi {
        return 301 /bi/;
    }

    location /bi/ {
        proxy_pass $upstream_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live usa WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $upstream_php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Ningún otro .php ni archivo oculto es accesible.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
