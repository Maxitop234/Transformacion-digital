# Entorno local completo de Cofrial (T-002).
#   cp .env.example .env
#   docker compose -f infra/docker/compose.dev.yml up -d
# Todas las variables salen del .env de la raíz del repositorio.
name: cofrial

x-app: &app
  build:
    context: ./web
  image: cofrial/web:dev
  env_file: ../../.env
  # Mismo usuario que el dueño del código montado, para poder escribir storage/.
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ../../apps/web:/var/www/html
    - ../../db:/var/www/db:ro
  restart: unless-stopped

# Simulador IoT (T-019): cinco réplicas, una por grupo de 10 camiones. Se declaran
# como servicios separados porque cada réplica necesita su IOT_GRUPO (con
# `deploy.replicas` todas recibirían el mismo entorno y se solaparían).
x-iot: &iot
  build:
    context: ../../apps/iot-simulator
    target: runtime
  image: cofrial/iot-simulator:dev
  env_file: ../../.env
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgis/postgis:16-3.4
    env_file: ../../.env
    # La imagen espera POSTGRES_*; se derivan del usuario maestro del .env.
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$DB_ADMIN_USERNAME"
        POSTGRES_PASSWORD="$$DB_ADMIN_PASSWORD"
        POSTGRES_DB="$$DB_DATABASE"
        TZ=UTC;
        exec docker-entrypoint.sh postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
      - ../../db:/cofrial-db:ro
    ports:
      # Solo en el equipo local, para clientes como psql o DBeaver.
      - "127.0.0.1:${COFRIAL_DB_PUERTO_LOCAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$DB_ADMIN_USERNAME\" -d \"$$DB_DATABASE\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    <<: *app
    environment:
      COFRIAL_COMPOSER_INSTALL: "1"
      COFRIAL_MIGRAR: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cofrial-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      # La primera vez instala dependencias de Composer.
      start_period: 180s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]
    depends_on:
      web:
        condition: service_healthy

  # Planificador de Laravel (routes/console.php): trabajos programados como el
  # abandono de carritos (T-010).
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      web:
        condition: service_healthy

  # Compila CSS (Tailwind) y JS con Vite en apps/web/public/build y los vuelve
  # a compilar al cambiar vistas, CSS o JS. Las dependencias de Node se
  # instalan en apps/web/node_modules (ignorado por git) desde package-lock.json.
  assets:
    image: node:22.23.3-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/npm
    volumes:
      - ../../apps/web:/app
    command:
      - sh
      - -c
      - >-
        if [ ! -f node_modules/.package-lock.json ] || [ package-lock.json -nt node_modules/.package-lock.json ];
        then npm ci --no-audit --no-fund; fi &&
        exec npx vite build --watch
    healthcheck:
      test: ["CMD", "test", "-f", "public/build/manifest.json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  nginx:
    image: nginx:1.30.5-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/websocket.conf:/etc/nginx/conf.d/00-websocket.conf:ro
      - ../../apps/web/public:/var/www/html/public:ro
    ports:
      - "127.0.0.1:${COFRIAL_WEB_PUERTO_LOCAL:-8080}:80"
    depends_on:
      web:
        condition: service_healthy
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    env_file: ../../.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/bi/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  iot-1:
    <<: *iot
    environment: { IOT_GRUPO: "1" }

  iot-2:
    <<: *iot
    environment: { IOT_GRUPO: "2" }

  iot-3:
    <<: *iot
    environment: { IOT_GRUPO: "3" }

  iot-4:
    <<: *iot
    environment: { IOT_GRUPO: "4" }

  iot-5:
    <<: *iot
    environment: { IOT_GRUPO: "5" }

volumes:
  db-data:
