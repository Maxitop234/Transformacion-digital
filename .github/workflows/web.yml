name: web

# Formateo y tests de apps/web (Laravel). Filtra por carpeta (ADR-0012).
on:
  push:
    paths:
      - "apps/web/**"
      - ".env.example"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".env.example"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Formateo y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    # Los tests corren contra PostgreSQL 16 + PostGIS, el mismo motor que RDS.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app_rw
          POSTGRES_PASSWORD: ci-solo-pruebas
          POSTGRES_DB: cofrial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_rw -d cofrial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: app_rw
      DB_PASSWORD: ci-solo-pruebas
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_pgsql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('apps/web/composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formateo (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test
